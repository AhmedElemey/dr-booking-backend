name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: moonlight_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: Host=localhost;Port=5432;Database=moonlight_test;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - run: dotnet tool restore
      - run: dotnet format --verify-no-changes --no-restore
      - run: dotnet build -warnaserror --no-restore
      - run: dotnet test --no-build
      - name: Export openapi.json
        run: dotnet swagger tofile --output openapi.json src/Moonlight.Api/bin/Debug/net8.0/Moonlight.Api.dll v1
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ConnectionStrings__Default: Host=localhost;Database=unused;Username=unused;Password=unused
          Jwt__Key: openapi-export-only-key-not-a-secret-0000000000
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json

  docker:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t moonlight-api:${{ github.sha }} .
