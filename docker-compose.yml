# Local dev database. Matches ConnectionStrings:Default in appsettings.Development.json.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moonlight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
